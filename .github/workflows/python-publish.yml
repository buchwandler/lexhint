# This workflow builds and publishes the Python package when a release is created.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build and validate distributions
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
      - name: Smoke test wheel in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -c "import lexhint; assert lexhint.__version__; print(lexhint.__version__)"
          .release-smoke/bin/lexhint --version
          .release-smoke/bin/lexhint --help
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
