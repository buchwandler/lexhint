    section_hash: 8bc7eff43b216cd60303a290354fa2c960e97d59a588aa526da44233dc4b4d8f
    summary: Quick start
    text: '## Quick start


      Install the normal English runtime artifact, inspect it, and query it locally:


      ```bash

      python -m pip install lexhint

      lexhint dataset download en

      lexhint dataset list

      lexhint word compiler -l en

      lexhint context "The compiler is 8.3.2." -l en --target 16:21

      lexhint complete comp -l en

      ```


      `lexhint dataset download` is the only networked step. `Lexicon`, query commands,
      and dataset inventory commands use installed files and do not silently contact
      GitHub.


      The download default is the `runtime` variant (`lexical,semantic`). Optional variants
      are:


      - `lexical` for membership, frequency, and segmentation;

      - `runtime` for lexical and semantic context evidence;

      - `dictionary` for entries, senses, topics, and rich dictionary rendering without
      search indexes;

      - `rich` for everything in `dictionary`, plus fuzzy suggestions and indexed definition/reverse
      search.


      Install several variants side by side:


      ```bash

      lexhint dataset download en --variant rich

      lexhint dataset list --language en

      lexhint dictionary word love -l en --variant rich

      lexhint dataset remove en --variant rich

      ```


      For reproducibility, install and select an exact release:


      ```bash

      lexhint dataset download en --variant runtime --version 2026.08.20

      ```


      The managed store uses `LEXHINT_DATA_DIR` when set, or the platform data directory
      otherwise. Artifacts are stored by base language, variant, exact SQLite schema,
      and dataset version. A local-build alternative is available with `lexhint dictionary
      build`; pass its output with `--path` when querying.


      For a small local artifact without FrequencyWords enrichment, build from the repository
      fixture with `lexhint dictionary build en --source tests/fixtures/kaikki-mini.jsonl
      --output /tmp/lexhint-en.sqlite3 --no-frequency` and pass `--path /tmp/lexhint-en.sqlite3`
      to the query commands.'
