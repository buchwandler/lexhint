    section_hash: 9f7104f98758a08f9efdb3ea57df6dad06bb2883d9f0c965192c5f9df5c8e8be
    summary: Dictionary API
    text: '## Dictionary API


      ```python

      from lexhint import Dictionary


      dictionary = Dictionary("en", fetch_missing=True)


      print(dictionary.senses("scale"))  # fetches once, then works offline

      print(dictionary.topics("compiler"))

      ```


      `Dictionary.from_path(path)` infers the language from index metadata. Supply

      `language="en"` when the caller wants the index language asserted explicitly.
      Use

      `refresh=True` on `senses()` or the context methods to refresh a cached word when

      network access is enabled.


      The default `Dictionary("en")` is local-only. Use `fetch_missing=True` only when
      the

      application explicitly permits network access.


      No topic score is negative evidence. It means that no positive evidence was found
      in

      the available dictionary coverage and annotations; a missing word, a partial cache,
      or

      sparse upstream topic labels can all produce no score. Use a local full snapshot
      and

      `offline=True` for deterministic benchmark or production runs.


      Wiktextract provides `topics` per sense when Wiktionary supplies that semantic
      metadata.

      A word can therefore have several senses with different topics instead of being
      globally

      assigned to one manually maintained domain.'
