    section_hash: 1da8907ceab3219783624a18c49e1ec4cfbb41d25e6f54d3798d752e32e3dff2
    summary: 1. Common-word lexicon
    text: '## 1. Common-word lexicon


      Open the highest-capability installed artifact with `Lexicon`, or select a variant/version
      explicitly:


      ```python

      from lexhint import Lexicon


      lexicon = Lexicon("en")  # highest installed compatible variant

      runtime = Lexicon("en", variant="runtime")

      pinned = Lexicon("en", variant="runtime", dataset_version="2026.08.20")

      info = lexicon.word("compiler")

      print(info.known, info.frequency_rank, info.has_lowercase, info.has_titlecase,
      info.has_uppercase)

      print(lexicon.segment("compilerword"))

      ```


      Locale is optional runtime presentation state, not a dataset identity. The base
      language remains `en`, and all of these requests can use the same physical artifact:


      ```python

      neutral = Lexicon("en")

      british = Lexicon("en", locale="GB")

      american = Lexicon("en", locale="en-US")

      ```


      `locale` accepts the canonical `GB` and `US` values plus their supported aliases.
      Without a locale, English remains region-neutral. Locale-aware ordering and labels
      use only regional tags retained from source data. Frequency remains base-language
      English data, not British or American frequency.


      Runtime access is local-only, deterministic, read-only, and never fetches missing
      entries or mutates the database. `complete()` performs deterministic normalized
      lexical-key prefix completion and is not a spelling corrector. It requires only
      the `lexical` capability, returns an exact key first, and ranks remaining full-prefix
      matches by corpus rank when available or lexical order otherwise. `segment()`
      and semantic context operations require full authoritative coverage.


      The public runtime operations are:


      ```python

      lexicon.word("compiler")

      lexicon.contains("compiler")

      lexicon.segment("chatgpt")

      lexicon.context_domains(text, target=(start, end))

      lexicon.supports_domain(text, target=(start, end), domain="computing")

      lexicon.entries("compiler")  # rich artifacts only

      ```


      Dictionary membership is authoritative. Frequency rank and count enrich existing
      lexemes but never create corpus-only words. `Lexicon.word()` reports normalized
      membership and the attested lowercase, titlecase, and uppercase forms. `uppercase_only`
      is true only for a known lexeme with uppercase attestation and no lowercase or
      titlecase attestation.


      `Lexicon.segment()` additionally applies surface-case acceptance rules. Therefore,
      an uppercase-only `GPT` entry does not validate lowercase `gpt`, and `segment("chatgpt")`
      can report `chat` as known and `gpt` as unknown. Consumers can use the richer
      `word()` evidence for context-specific policy without weakening segmentation.


      Semantic results are explainable `DomainEvidence` values containing score and
      nearby `ContextCue` records. Context is measured from the target character span:
      overlapping lexical tokens are excluded, while a target containing no lexical
      token acts as a virtual boundary and leaves adjacent words eligible at distance
      1. These are soft hints, so missing evidence is not negative evidence and positive
      evidence is not semantic certainty.'
