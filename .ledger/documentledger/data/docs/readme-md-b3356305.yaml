    section_hash: e12fed24a7e8ab3955561eab153f84288392177b8dc97ed88bc81123cc9b33fb
    summary: Dictionary schema 10 contract
    text: "## Dictionary schema 10 contract


      Schema 10 dictionary entries expose a versioned deterministic `sense_id` in JSON
      and through `Lexicon.sense_by_id()`. The ID is Lexhint-owned and stable across
      equivalent builds, not a permanent Wiktionary ID. Raw upstream `senseid` and Wikidata
      values, when available, appear separately as namespaced source provenance. Entry-level
      synonyms, antonyms, hypernyms, hyponyms, and related terms are headword relations;
      sense-level synonyms and antonyms remain attached to their exact senses.


      Use the incoming relation view when a target headword is the subject of the lookup:


      ```bash

      lexhint dictionary relations love --incoming --variant dictionary

      ```


      Schema 10 artifacts are rebuilt from raw source rather than migrated. The `dictionary`
      variant contains full dictionary content without search indexes. The `rich` variant
      adds the larger fuzzy and definition-search indexes.

      Use `--json` for stable, complete machine-readable output. POS selection applies
      to JSON entries, while `--detail`, `--show`, `--hide`, and `--width` are human-only
      options. `dictionary status` reports current SQL row counts, capabilities, provenance,
      size, and build metadata without rebuilding. Use `--path` as an advanced override
      when inspecting a specific artifact. Rich dictionary lookup reports a controlled
      capability error for compact runtime artifacts."
    links: []
