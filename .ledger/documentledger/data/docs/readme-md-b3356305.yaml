    section_hash: ede39a736f383d2bbb4cd109f51b96dcea6cbd950b7952e32bb10554c8e4a7f4
    summary: 1. Common-word lexicon
    text:
      "# 1. Common-word lexicon\n\nFetch a FrequencyWords top-50k list:\n\n```bash\n\
      lexhint fetch en\nlexhint fetch de fr es it pt cs\n```\n\nDefault cache:\n\n```text\n\
      ~/.cache/lexhint/words/<language>.txt.gz\n~/.cache/lexhint/words/<language>.metadata.json\n\
      ```\n\nOverride the complete cache root with `LEXHINT_CACHE_DIR`.\n\nWord-list\
      \ downloads use a pinned FrequencyWords revision. The metadata sidecar records\n\
      the source revision, normalized content SHA-256, language, and word count, so\
      \ a cache\ncan be checked for provenance and corruption before it is reused. Use\
      \ `--force` when an\nexplicit refresh is wanted.\n\nPython:\n\n```python\nfrom\
      \ lexhint import LexicalSegment, Lexicon\n\nlex = Lexicon(\"en\")\n\nassert lex.contains(\"\
      chat\")\nprint(lex.rank(\"chat\"))\nprint(lex.segment(\"chatgpt\"))\n```\n\nWord\
      \ lists load lazily. Pass `path` to use a specific gzip list, `auto_fetch=True`\
      \ to\nopt into downloading a missing list, or use `Lexicon.from_words(words)`\
      \ for an\nin-memory lexicon in tests and embedded applications.\n\nExpected segmentation\
      \ shape:\n\n```python\n(\n    LexicalSegment(text=\"chat\", in_lexicon=True, frequency_rank=...),\n\
      \    LexicalSegment(text=\"gpt\", in_lexicon=False, frequency_rank=None),\n)\n\
      ```\n\n`in_lexicon` is lexical-resource evidence only. It is not a pronunciation\
      \ or\ninterpretation decision. `Lexicon.segment()` accepts one compact identifier\
      \ or domain\nlabel; the caller owns URL schemes, dots, paths, ports, and other\
      \ URL syntax.\n\nCLI:\n\n```bash\nlexhint word chat\nlexhint segment chatgpt\n\
      ```"
