  section_hash: f2dc29f057b7bb59ed11ef5feb5c54fc5c1d22a302506bd821674f7e868df713
  summary: 1. Common-word lexicon
  text: "# 1. Common-word lexicon\n\nFetch a FrequencyWords top-50k list:\n\n```bash\n\
    lexhint fetch en\nlexhint fetch de fr es it pt cs\n```\n\nDefault cache:\n\n```text\n\
    ~/.cache/lexhint/words/<language>.txt.gz\n```\n\nOverride the complete cache root\
    \ with `LEXHINT_CACHE_DIR`.\n\nPython:\n\n```python\nfrom lexhint import Lexicon\n\
    \nlex = Lexicon(\"en\")\n\nassert lex.contains(\"chat\")\nprint(lex.rank(\"chat\"\
    ))\nprint(lex.segment(\"chatgpt\"))\n```\n\nExpected segmentation shape:\n\n```python\n\
    (\n    Segment(text=\"chat\", known=True, rank=...),\n    Segment(text=\"gpt\"\
    , known=False, rank=None),\n)\n```\n\nA speech layer can therefore keep `chat`\
    \ lexical and spell the unknown `gpt` run.\n\nCLI:\n\n```bash\nlexhint word chat\n\
    lexhint segment chatgpt\n```"
