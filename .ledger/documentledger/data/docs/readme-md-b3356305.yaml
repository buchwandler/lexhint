    summary: Development
    text: '## Development


      Contributor setup uses an editable installation with development tools:


      ```bash

      git clone https://github.com/buchwandler/lexhint.git

      cd lexhint

      python -m pip install -e ".[dev]"

      pytest -q

      ruff check .

      mypy lexhint

      ```'
