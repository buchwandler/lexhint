    section_hash: ca1861051cbc22d0ace6f30a06ab95a79d4f271c3bd46c768b2b595a051bf11d
    summary: 1. Common-word lexicon
    text: '## 1. Common-word lexicon


      Open a local artifact with `Lexicon`:


      ```python

      from lexhint import Lexicon


      lexicon = Lexicon.from_path("en.sqlite3")

      info = lexicon.word("compiler")

      print(info.known, info.frequency_rank)

      print(lexicon.segment("compilerword"))

      ```


      Runtime access is local-only, deterministic, read-only, and never fetches missing
      entries or mutates the database. `segment()` and semantic context operations require
      full authoritative coverage.


      The public runtime operations are:


      ```python

      lexicon.word("compiler")

      lexicon.contains("compiler")

      lexicon.segment("chatgpt")

      lexicon.context_domains(text, target=(start, end))

      lexicon.supports_domain(text, target=(start, end), domain="computing")

      lexicon.entries("compiler")  # rich artifacts only

      ```


      Dictionary membership is authoritative. Frequency rank and count enrich existing
      lexemes but never create corpus-only words. Case evidence is retained, so an uppercase-only
      `GPT` entry does not validate lowercase `gpt`.


      Semantic results are explainable `DomainEvidence` values containing score and
      nearby `ContextCue` records. The target span is always excluded, and missing evidence
      is not negative evidence.'
