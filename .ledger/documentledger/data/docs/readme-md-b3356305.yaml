    section_hash: 4b8ea2355733ba7c7778a92872badee2e2267e75e634ac8604e1e7ed62e58d91
    summary: CLI queries
    text: '## CLI queries


      The default download installs the `runtime` variant. Install the `rich` variant
      before using search-capable commands such as `suggest`, `headwords`, or `dictionary
      search`:


      ```bash

      lexhint dataset download en --variant rich

      ```


      ```bash

      lexhint word compiler -l en

      lexhint word compiler -l en --variant runtime

      lexhint segment chatgpt -l en --dataset-version 2026.08.20

      lexhint context "The compiler is 8.3.2." -l en --target 16:21

      lexhint complete comp -l en --limit 10

      lexhint --json complete comp -l en --limit 10

      lexhint suggest compilar -l en --variant rich --limit 10

      lexhint headwords ''comp*'' -l en --variant rich --syntax glob

      lexhint dictionary search "large feline" -l en --variant rich --fields glosses
      --match all

      lexhint --json dictionary search "large feline" -l en --variant rich

      lexhint dictionary word compiler -l en --variant rich

      lexhint dictionary status en --variant runtime

      ```


      All artifact-consuming query commands accept `--variant` and `--dataset-version`;
      `--path` remains an explicit custom-file override. Use `--json` for one JSON document
      on stdout. Dataset `list`, `info`, and `validate` are local; `available` and `download`
      access the published catalog.


      Dictionary word output has three human-readable detail levels. The default `standard`
      view shows all senses with compact metadata. Use `compact` for a deliberately
      short shell view, or `full` for every field retained by the local Lexhint dictionary
      model:


      ```bash

      lexhint dictionary word love

      lexhint dictionary word love --detail compact

      lexhint dictionary word love --detail full

      lexhint dictionary word love --detail full --hide examples,tags

      lexhint dictionary word love --detail compact --show examples

      lexhint dictionary word love --pos noun,verb --exclude-pos proper_noun

      lexhint --json dictionary word love --pos noun

      ```


      The `--show` and `--hide` options accept repeatable comma-separated fields. Canonical
      fields are `etymology`, `pronunciations`, `forms`, `tags`, `topics`, `examples`,
      `synonyms`, and `antonyms`; the `all`, `entry`, `sense`, and `relations` groups
      are also supported. `--width` controls human output from 40 through 240 columns.


      Human CLI output uses ANSI color automatically on interactive terminals. Use `--no-color`
      or the `NO_COLOR` environment variable to disable it. Color is never emitted for
      JSON or non-TTY stdout.'
