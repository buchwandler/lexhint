    section_hash: 9eb6d87c9daa6edb355cf01693c5f6309693d179792cc5f6a054c1e56a8e83c0
    summary: lexhint
    text: "# lexhint


      Lexhint is a local lexical-evidence engine backed by self-describing SQLite language
      databases. It provides lexical membership, optional corpus commonness, compact-string
      segmentation, semantic-domain evidence, and optional rich dictionary entries.


      Lexhint does not normalize or speak text. Word boundaries, acronyms, URLs, numbers,
      versions, and pronunciation policy belong to the consuming application."
    links: []
