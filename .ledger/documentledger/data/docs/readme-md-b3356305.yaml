    section_hash: 40eb8e8a873b667cdf0c234ced56b84d8b75d8d9bf7db9d0dc2c23f3825271b8
    summary: Candidate-aware context evidence
    text:
      "## Candidate-aware context evidence\n\n`spokenform` already knows the interpretation\
      \ it wants to test. `lexhint` only answers\nwhether nearby dictionary senses support\
      \ its semantic topic.\n\n```python\nfrom lexhint import Dictionary\n\nlex = Dictionary(\"\
      en\")\n\ntext = \"The scale is Am.\"\nstart = text.index(\"Am\")\n\nsupport =\
      \ lex.supports(\n    text,\n    target=(start, start + len(\"Am\")),\n    topic=\"\
      music\",\n)\n\nassert support is not None\nprint(support.cues)  # includes \"\
      scale\" when its dictionary sense has topic=music\n```\n\nLikewise for software\
      \ versions:\n\n```python\ntext = \"The compiler is 8.3.2.\"\nstart = text.index(\"\
      8.3.2\")\n\nsupport = lex.supports(\n    text,\n    target=(start, start + len(\"\
      8.3.2\")),\n    topic=\"computing\",\n)\n```\n\nThe target token itself is deliberately\
      \ excluded from context evidence. A candidate\ncannot validate its own interpretation.\n\
      \n`topic_scores()` returns `TopicEvidence` values. Each value includes structured\n\
      `ContextCue` records with the cue text, source span, token distance, and decay\
      \ weight.\nUse `window`, `decay`, and `limit` to control the diagnostic search;\
      \ `supports()` also\naccepts a score `threshold`. An absent score is not negative\
      \ evidence.\n\nFor diagnostics, inspect all nearby dictionary topics:\n\n```python\n\
      for score in lex.topic_scores(text, target=(start, start + len(\"8.3.2\"))):\n\
      \    print(score.topic, score.score)\n    print([\n        (cue.text, cue.start,\
      \ cue.end, cue.distance, cue.weight)\n        for cue in score.cues\n    ])\n\
      ```\n\nCLI:\n\n```bash\nlexhint dictionary word en compiler\nlexhint dictionary\
      \ fetch scale house compiler\nlexhint --offline dictionary word en compiler\n\
      lexhint context en music \"The scale is Am.\" --target Am\nlexhint --offline context\
      \ en computing \"The compiler is 8.3.2.\" --target 8.3.2\n```"
