    section_hash: aadc2f0f5aa016d19087486c23654e590b8b46ad20eaedd1161121dfca669638
    summary: 2. Dictionary-derived context
    text: '# 2. Dictionary-derived context


      Instead of maintaining a file such as `en.json`, build a compact dictionary index
      from

      Wiktextract/Kaikki JSONL.


      The Kaikki raw English-edition extraction contains many languages, so the builder
      checks

      `lang_code` and can produce indexes for `en`, `de`, `fr`, and other languages
      from the

      same source when those entries are present.


      The common-word lexicon and semantic dictionary are independent resources. Dictionary

      building does not require a FrequencyWords list. To build from a downloaded Kaikki
      file:


      ```bash

      lexhint dictionary build en ~/Downloads/raw-wiktextract-data.jsonl.gz

      ```


      The lazy word path avoids the multi-gigabyte download entirely. For complete local

      coverage, use the built-in official Kaikki source directly:


      ```bash

      lexhint dictionary build en

      ```


      That source is very large. The builder reads it line-by-line and stores compact

      dictionary senses containing glosses and explicit semantic topics. Context scoring
      uses only

      the explicit topics. Dictionary vocabulary is not restricted to the FrequencyWords
      common-word

      list; technical semantic cues such as "compiler" can therefore be retained. The
      resulting

      database defaults to:


      ```text

      ~/.cache/lexhint/dictionaries/en.sqlite3

      ```


      The schema v4 index stores compact sense rows plus partial-cache coverage metadata.

      Partial indexes are live, network-opt-in caches. Full indexes built from a local
      source

      are reproducible snapshots identified by their source SHA-256; a full index built
      from a

      remote URL records that it is live-full unless the caller supplies a separately
      pinned

      source. `Dictionary.from_path(path)` reads the language from index metadata, while

      `Dictionary.from_path(path, language="en")` asserts it.

      Each row contains:


      ```text

      word

      display spelling

      part of speech

      glosses

      topics

      ```


      It is deliberately not a full Wiktionary mirror. A sense is retained when it has
      a

      dictionary gloss or an explicit entry-level or sense-level Wiktextract topic.'
