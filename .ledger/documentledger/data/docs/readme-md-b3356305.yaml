    section_hash: c06816006cd36a0770372902329bda4eb58cddb4d0c95f7943ee87d177f79905
    summary: Build an artifact
    text: "## Build an artifact


      The default build creates a full `lexical,semantic,dictionary` artifact and automatically
      acquires the pinned full FrequencyWords source:


      ```bash

      lexhint dictionary build en

      ```


      Use a local or remote dictionary source and explicit build policies when needed:


      ```bash

      lexhint dictionary build en --source ./raw-wiktextract-data.jsonl.gz

      lexhint dictionary build en --capabilities lexical,semantic --no-frequency

      lexhint dictionary build en --profile runtime

      lexhint dictionary build en --frequency-source ./en_full.txt

      lexhint dictionary build en --refresh-frequency

      lexhint --offline dictionary build en --source ./raw-wiktextract-data.jsonl.gz

      ```


      Capabilities are canonicalized in the order `lexical,semantic,dictionary`. `semantic`
      and `dictionary` require `lexical`. Profiles are shortcuts: `runtime` means `lexical,semantic`,
      and `rich` means `lexical,semantic,dictionary`.


      Frequency enrichment is independent of capabilities. Use `--no-frequency` for
      a valid lexical artifact without corpus data. Automatic sources are cached under
      `~/.cache/lexhint/sources/frequencywords/<revision>/`, or an equivalent XDG/`LEXHINT_CACHE_DIR`
      location. Builds record source URLs, revisions, hashes, schema, capabilities,
      and builder metadata. Build configuration and progress are written to stderr,
      while the final result, including JSON, is written to stdout."
