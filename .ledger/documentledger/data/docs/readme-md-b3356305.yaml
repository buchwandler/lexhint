    section_hash: 8958fccd7ae41596a2aac70d25e7cbb87b38de491898339fb33604d75343e513
    summary: Quick start
    text: '## Quick start


      After installing the package and an English artifact, run:


      ```bash

      lexhint word compiler

      lexhint segment compilerword

      lexhint context "The compiler is 8.3.2." --target 16:21

      lexhint dictionary word compiler

      lexhint dictionary status

      ```


      For a small local artifact without FrequencyWords enrichment, build from the repository
      fixture with `lexhint dictionary build en --source tests/fixtures/kaikki-mini.jsonl
      --output /tmp/lexhint-en.sqlite3 --no-frequency` and pass `--path /tmp/lexhint-en.sqlite3`
      to the query commands.'
