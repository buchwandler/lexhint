    section_hash: 038d7efedac49ea191bc45937f04bac949f1a8e1f8143f23075e1199350ea65b
    summary: Data and scope
    text: "## Data and scope


      The builder consumes Wiktextract-compatible JSONL, commonly from Kaikki, and FrequencyWords
      full files for optional corpus enrichment. See [DATA_SOURCES.md](DATA_SOURCES.md)
      for source and licensing information.


      Lexhint does not implement Spokenform integration, dataset publication, URL parsing,
      speech rendering, or consumer-specific interpretation rules. The separate `buchwandler/lexhint-datasets`
      repository is outside this project."
    links: []
