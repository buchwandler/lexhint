    section_hash: cf58592a44c682ba4d96614e3f40ab1a2e409b7f91fcfd60235589eabf2039a3
    summary: Install
    text: "## Install


      ```bash

      python -m pip install lexhint

      ```


      Lexhint supports Python 3.10 through 3.14. The Python package contains code only,
      so install a dataset explicitly after installing the package. Published datasets
      are maintained separately in the [lexhint-datasets repository](https://github.com/buchwandler/lexhint-datasets),
      with their own licensing and provenance."
    links: []
