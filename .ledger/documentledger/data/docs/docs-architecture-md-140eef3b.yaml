    section_hash: f02f8586fca72897baa47963fd0ce17dfb0d1e6f0a0ad8ed0b242f4a24e3c64c
    summary: Provenance and data lifecycle
    text: "### Provenance and data lifecycle


      Metadata records `dictionary_source`, `dictionary_source_sha256`, `frequency_source`,
      and `frequency_source_sha256`, alongside profile, capabilities, creation time,
      and builder version. Remote dictionary input is hashed while streamed. Automatic
      FrequencyWords sources are cached by pinned revision and language, validated against
      an atomic SHA-256 sidecar, and downloaded through temporary files followed by
      atomic rename."
    links: []
