    section_hash: fef9cdfed0460c85957977a2359675c62a62e730e610bec11b2fadcff5c20373
    summary: Provenance and data lifecycle
    text: "### Provenance and data lifecycle


      Metadata records `dictionary_source`, `dictionary_source_sha256`, `dictionary_source_format`,
      `dictionary_source_contract`, `frequency_source`, and `frequency_source_sha256`,
      alongside profile, capabilities, creation time, and builder version. Remote dictionary
      input is hashed while streamed. Automatic FrequencyWords sources are cached by
      pinned revision and language, validated against an atomic SHA-256 sidecar, and
      downloaded through temporary files followed by atomic rename."
    links: []
  - section_id: md:section:docs/architecture.md::relation-decision-evidence
    doc_path: docs/architecture.md
