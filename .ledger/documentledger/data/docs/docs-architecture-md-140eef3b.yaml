    section_hash: 570e953418fef9572cd78e1bf8c77de7eaeb04f87ded570e603909583c7b2b6a
    summary: Schema 10 freeze and bump policy
    text: "## Schema 10 freeze and bump policy


      Schema 10 is frozen at the `v0.4.0` release boundary. The structured contract
      in `lexhint.schema_contract` is the reviewable definition of the published SQLite
      layout. It covers required tables, ordered columns, primary and foreign keys,
      required indexes, `WITHOUT ROWID` tables, capability relationships, and persisted
      format versions. Runtime and managed dataset validation check that contract before
      capability-specific queries begin. SQLite `application_id` and `user_version`
      identify a Lexhint schema-10 file for diagnostics, while metadata `schema_version`
      remains authoritative.


      A future change requires a schema bump unless it is proven compatible with existing
      schema-10 readers. Bump for required table or column additions, removals, or renames;
      primary-key or runtime-required foreign-key changes; required-index changes that
      alter query assumptions; incompatible JSON payload encodings; deterministic sense-ID
      type or anchor changes; or search-index construction changes that an existing
      reader would interpret differently. Schema 10 also covers the `lh1` public sense-ID
      interpretation, source provenance encoding, and the persisted forms, pronunciations,
      glosses, topics, tags, examples, synonyms, antonyms, relation tags, and semantic
      source-topic JSON arrays.


      Optional metadata keys, diagnostics, error messages, rendering, additive runtime
      helpers, compatible performance work, and additional validation do not require
      a schema bump when stored and queried semantics remain unchanged. A schema bump
      requires rebuilding and republishing every managed variant. Schema 9 artifacts
      are never migrated in place.


      <!-- archledger: no accepted records for this section yet -->"
