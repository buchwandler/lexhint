    summary: Word membership and segmentation
    text: "## Word membership and segmentation


      1. The CLI or API selects a language and constructs `Lexicon`.

      2. The lexicon resolves a vendored resource, user cache, or explicitly requested
      path and loads it on first use.

      3. `rank` returns one-based source order. `segment` evaluates candidate word spans,
      rewards longer and frequent words, penalizes unknown characters, and merges adjacent
      unknown spans.

      4. The result is a tuple of `Segment` values for the consumer."
