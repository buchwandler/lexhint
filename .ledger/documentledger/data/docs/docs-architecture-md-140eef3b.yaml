  - section_id: md:section:docs/architecture.md::risks-and-technical-debt
    doc_path: docs/architecture.md
    heading_path:
      - Risks and Technical Debt
    heading_slug: risks-and-technical-debt
    line_span:
      - 283
      - 291
    section_hash: d809a5ae7d5c4f9234675f80188a63ee2ba6dce5414e6463d76a1f2d2e173c66
    summary: Risks and Technical Debt
    text: "# Risks and Technical Debt


      - **Upstream availability and format drift.** FrequencyWords and Wiktextract/Kaikki
      remain external inputs. Hash validation and source checks reduce silent corruption,
      but upstream changes can still prevent builds.

      - **External data licensing.** Generated artifacts inherit obligations from their
      dictionary and corpus sources. Redistribution must follow `DATA_SOURCES.md`.

      - **Heuristic segmentation.** Dynamic-programming segmentation is evidence, not
      linguistic analysis, and may need tuning for new languages or identifier styles.

      - **Incomplete capability coverage.** A consumer cannot use dictionary or semantic
      operations when the artifact lacks those capabilities. Missing evidence must not
      be treated as semantic negation.

      - **Schema evolution.** Incompatible schema or capability changes require rebuilding
      artifacts.

      - **Scope boundary.** Lexhint does not pronounce text, tokenize all consumer inputs,
      or resolve interpretation precedence. Those responsibilities remain downstream."
    links: []
