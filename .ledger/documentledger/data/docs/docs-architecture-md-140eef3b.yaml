    section_hash: 8b3f140c8809b551b5e1da7ee6db2b9d8f749020237e27a5a19d2df0477da782
    summary: Word membership and segmentation
    text: "## Word membership and segmentation


      1. The CLI or API selects a language and constructs `Lexicon`.

      2. The lexicon resolves inline words, an explicitly requested path, a vendored
      resource, or a user cache and loads file-backed words on first use. Missing resources
      are fetched only when `auto_fetch` is enabled.

      3. `rank` returns one-based source order. `segment` evaluates candidate word spans,
      rewards longer and frequent words, penalizes unknown characters, and merges adjacent
      unknown spans.

      4. The result is a tuple of `LexicalSegment` values. `in_lexicon` reports lexical-resource
      evidence only; it does not select pronunciation."
