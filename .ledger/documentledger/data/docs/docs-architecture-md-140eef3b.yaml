    section_hash: 0632f97d0dbe5fc87875480d8444291a0f5224fadbe2397890bd64ca68208bd7
    summary: Relation decision evidence
    text: "### Relation decision evidence


      The schema 10 benchmark compares a pre-schema-10 relation layout with compact
      compound-key tables and immutable index finalization. On the smoke profile, the
      candidate measured 204,800 raw bytes and 36,558 gzip bytes versus 425,984 raw
      bytes and 96,183 gzip bytes for the baseline. Suggestion and definition-search
      timings were slower in this two-iteration run, so the measurements are comparative
      evidence rather than English-dataset estimates."
    links: []
  - section_id: md:section:docs/architecture.md::errors-and-offline-behavior
    doc_path: docs/architecture.md
    heading_path:
      - Cross-cutting Concepts
      - Errors and offline behavior
    heading_slug: errors-and-offline-behavior
    line_span:
      - 221
      - 224
    section_hash: 504b258446748da0fd3736a54fbb2ef1c4a4c78ae59ad20ec313a94a8b69182d
    summary: Errors and offline behavior
    text: "### Errors and offline behavior


      Capability, coverage, schema, language, and missing-artifact failures have controlled
      public exceptions. Offline mode rejects every HTTP(S) build source and permits
      only local or already validated cached inputs. Frequency acquisition fails the
      build unless the caller explicitly selects `--no-frequency` or a custom source.
      Missing semantic evidence is not semantic negation."
    links: []
  - section_id: md:section:docs/architecture.md::verification-and-licensing
    doc_path: docs/architecture.md
    heading_path:
      - Cross-cutting Concepts
      - Verification and licensing
    heading_slug: verification-and-licensing
    line_span:
      - 225
      - 232
    section_hash: 4e42aeb7d5c767e7ff66ceaf8ab0f75501600ba74b85e1e3e1ce61edb32c3282
    summary: Verification and licensing
    text: "### Verification and licensing


      Tests cover read-only behavior, no-network guards, segmentation, case attestation,
      virtual-boundary semantic target anchoring, schema and capability validation,
      frequency policy, semantic target exclusion, CLI contracts, source extraction,
      relation extraction/API/CLI/projection, and the managed four-variant resolver
      chain. External dictionary and corpus data remain subject to the obligations documented
      in `DATA_SOURCES.md`.


      Raw bulk Wiktextract input does not contain Kaikki postprocessed website `sense.id`
      values. Lexhint therefore ignores that field, retains sparse `senseid` and Wikidata
      provenance when available, and generates a versioned deterministic `lh1-<language>-<encoded>`
      sense ID. High-cardinality translations and derived graphs remain optional data
      rather than core tables."
    links: []
  - section_id: md:section:docs/architecture.md::explicit-immutable-managed-dataset-artifacts
    doc_path: docs/architecture.md
    heading_path:
      - Cross-cutting Concepts
      - Explicit immutable managed dataset artifacts
    heading_slug: explicit-immutable-managed-dataset-artifacts
    line_span:
      - 233
      - 238
    section_hash: 79674cd40a6acf62121dbd3b624e5c68c3fdf1f7e272baf36afd3dfc224e3696
    summary: Explicit immutable managed dataset artifacts
    text: "## Explicit immutable managed dataset artifacts


      Lexhint treats published datasets as explicit, immutable local artifacts rather
      than package-installed Python models. The dataset manager stores artifacts by
      normalized base language, capability variant, exact schema family, and exact release
      version under the persistent data directory. Downloads stream gzip data, verify
      manifest hashes, sizes, schema, language, coverage, and capabilities, then atomically
      install the database and sidecar metadata. Runtime Lexicon construction resolves
      only installed files and never contacts the network automatically. The highest-capability
      compatible installed variant is selected by default, while callers may pin a variant
      and release version.


      Managed variants are capability presets: `runtime` is the recommended `lexical,semantic`
      artifact, `dictionary` is the `lexical,semantic,dictionary` projection for dictionary
      inspection without search indexes, and `rich` adds `search` for fuzzy suggestions
      and indexed definition/reverse search. The strict capability chain keeps automatic
      selection unambiguous."
    links: []
  - section_id: md:section:docs/architecture.md::architecture-decisions
    doc_path: docs/architecture.md
    heading_path:
      - Architecture Decisions
    heading_slug: architecture-decisions
    line_span:
      - 239
      - 261
    section_hash: 73d7af386bb5da733935013d80fc594990909ef67d386c41aa46095a5ffb6f6b
    summary: Architecture Decisions
    text: "# Architecture Decisions


      The current architecture records these decisions.


      - **Use a self-describing SQLite artifact.** Schema, language, coverage, profile,
      capabilities, and provenance are validated at runtime.

      - **Separate lexical, semantic, dictionary, and search capabilities.** Consumers
      can select evidence and index size intentionally without allowing data from an
      older artifact to leak into a fresh build.

      - **Use deterministic sense identity and compact schema 10 artifacts.** Every
      retained sense receives a versioned Lexhint-owned ID based on stable identity
      fields and legitimate upstream provenance. Published artifacts use explicit schema
      10 rebuilds, compact compound-key tables, and read-only finalization checks.

      - **Use indexed lexical ranges for completion.** `complete()` is a local read-only
      normalized prefix query with exact-match priority and explicit frequency or lexical
      ordering.

      - **Treat frequency as enrichment.** Corpus rank improves segmentation and commonness
      evidence but does not define lexical capability.

      - **Build fresh artifacts atomically.** Capability-specific tables are created
      from the resolved build plan and replacements cannot expose partial output.

      - **Use stable semantic domains.** Raw source topics are projected into a small
      deterministic taxonomy at build time.

      - **Expose case attestation without weakening segmentation.** `word()` exposes
      normalized membership and stored case forms, while `segment()` retains surface-case
      acceptance so consumers can apply context-specific policy.

      - **Anchor semantic context to character spans.** Overlapping target tokens are
      excluded; a target with no lexical token is a virtual boundary whose adjacent
      cues remain eligible at distance 1.

      - **Treat semantic context as soft evidence.** Lexhint reports explainable hints,
      not sense disambiguation or semantic certainty.

      - **Keep the runtime read-only and offline by default.** Acquisition belongs to
      explicit build workflows.

      - **Keep a narrow consumer boundary.** Lexhint supplies evidence; downstream consumers
      own interpretation and speech rendering.

      - **Do not mirror the full Wiktextract schema or adopt online provider plugins,
      runtime caches, raw Wiktionary parsing, translations, or audio persistence.**

      - **Keep sense_topics compact.** Option B stores `(topic, sense_id)` without redundant
      entry IDs or unused indexes.

      - **Separate dictionary content from search indexes.** The named `dictionary`
      profile preserves dictionary fidelity without the larger search structures.

      - **Freeze schema 10 as an explicit compatibility boundary.** The structural contract,
      capability-aware validator, exact metadata version check, deterministic `lh1`
      identity, persisted JSON formats, and search-index version are part of the artifact
      contract. Incompatible changes require schema 11 and a full rebuild of all managed
      variants.


      <!-- archledger: no accepted records for this section yet -->"
    links: []
  - section_id: md:section:docs/architecture.md::quality-requirements
    doc_path: docs/architecture.md
    heading_path:
      - Quality Requirements
    heading_slug: quality-requirements
    line_span:
      - 262
      - 274
    section_hash: 61548126e8f7083475a2b2f666ba38b82c68723bb20e6824ec92ede370148d13
    summary: Quality Requirements
    text: "# Quality Requirements


      | Quality attribute | Architectural response                                                                                           |
      Observable scenario                                                                                |

      | ----------------- | ----------------------------------------------------------------------------------------------------------------
      | --------------------------------------------------------------------------------------------------
      |

      | Correctness       | Explicit schema and capability validation, case-aware lexemes,
      authoritative full coverage, and target exclusion | A candidate is never used
      as its own semantic cue and incompatible artifacts fail at construction. |

      | Determinism       | Stable source projections, bounded weights, immutable build
      plans, and explicit result fields                    | Repeating a local query
      returns the same segments and evidence ordering.                           |

      | Performance       | Indexed SQLite lookups, bounded context windows, batched
      nearby-word queries, and streamed builds                | A context query evaluates
      only the bounded local evidence window.                                  |

      | Resilience        | Read-only runtime access, source hashes, temporary downloads,
      and atomic replacement                             | A failed build does not replace
      an existing artifact with partial output.                          |

      | Maintainability   | Focused runtime and build modules, capability-specific schema,
      and boundary tests                                | Schema, extraction, semantic
      projection, storage, and CLI behavior can be checked independently.   |

      | Compliance        | External resources remain separate from code and provenance
      is embedded in artifacts                             | A distributor can review
      data obligations before distributing generated artifacts.                 |"
    links: []
