    section_hash: 5c4e739b7d5e7d26c05c9da1ab176689e57f8bcb7258865fa621cc14626e6c46
    summary: Lexical lookup and segmentation
    text: "## Lexical lookup and segmentation


      1. The consumer constructs `Lexicon` from one local SQLite artifact, resolved
      from the vendored, configured cache, or schema-aware managed dataset path when
      no override is supplied.

      2. Construction validates exact schema version, base language, coverage, and explicit
      capabilities before queries.

      3. An optional locale such as `GB` or `US` is runtime presentation state. It does
      not change artifact resolution or physical English dataset identity. Regional
      source tags are defined once in `languages.py` and used by runtime ordering.

      4. `word()` and `contains()` query lexical keys. `complete()` performs bounded
      normalized prefix completion through exact lookup and indexed lexical range queries;
      it is not fuzzy correction. `suggest()` uses bounded n-gram candidates, `match_headwords()`
      uses safe glob/regex scans, and `search_definitions()` joins the indexed sense-term
      table without exposing SQLite details. `segment()` evaluates known spans using
      authoritative full coverage, case flags, dynamic programming, and optional corpus
      rank, while retaining strict surface-case acceptance.

      5. Runtime reads do not acquire missing data or write to the artifact."
    links: []
  - section_id: md:section:docs/architecture.md::dictionary-relations
    doc_path: docs/architecture.md
    heading_path:
      - Runtime View
      - Dictionary relations
    heading_slug: dictionary-relations
    line_span:
      - 164
      - 169
    section_hash: 9129f5f4f693fa56007be86c63e0ea17f0f5b3e6a58c43c618625d69bee676a4
    summary: Dictionary relations
    text: "## Dictionary relations


      1. Build-time defensive extraction projects only the narrow Lexhint-owned Wiktextract
      fields. It retains redirects, `alt_of`, and `form_of` as typed relation candidates
      and drops unrelated upstream fields.

      2. Schema 10 stores deterministic sense IDs, compact source provenance, and normalized
      `redirect`, `alternative`, `form_of`, `synonym`, `antonym`, `hypernym`, `hyponym`,
      and `related` headword rows only with the `dictionary` capability. Sense-level
      synonyms and antonyms remain attached to their exact senses, while incoming relations
      use the target index.

      3. `relations(word)` performs bounded exact source lookup. `resolve_headword(word)`
      follows only the requested relation types. Neither operation is implicit in `entries()`
      or fuzzy search."
    links: []
  - section_id: md:section:docs/architecture.md::semantic-evidence
    doc_path: docs/architecture.md
    heading_path:
      - Runtime View
      - Semantic evidence
    heading_slug: semantic-evidence
    line_span:
      - 170
      - 182
    section_hash: b119dc689eea932e7e142ad09fdead9a4e036350c306b8be3f8b1dbafe1f7ac1
    summary: Semantic evidence
    text: "## Semantic evidence


      1. `lexhint.semantics` maps supported raw source topics to stable `SemanticDomain`
      values at build time.

      2. Context distances are measured from the target character span. Every lexical
      token overlapping a non-empty target is excluded. If no lexical token overlaps,
      the target is a virtual insertion boundary and no real token is discarded.

      3. Nearby words are queried in batches. Domain weights receive configurable distance
      decay, with adjacent eligible tokens at distance 1.

      4. Results preserve cue text, character spans, token distance, and contribution
      weight. The candidate cannot validate itself. Domain results are hints rather
      than sense-disambiguated semantic certainty, and missing evidence is not negative
      evidence.


      The public dictionary API distinguishes sense-scoped relations from unsense-disambiguated
      headword relations and exposes `sense_by_id()` and `incoming_relations()`.




      <!-- archledger: no accepted records for this section yet -->"
    links: []
