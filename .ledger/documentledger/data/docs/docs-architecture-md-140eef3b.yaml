    section_hash: 64bdcff8c536c40e95c9d5affbb65026d6534ffd06face2a291351aecd438ff7
    summary: Source contract and diagnostics
    text: "### Source contract and diagnostics


      The build consumes a narrow Lexhint-owned TypedDict contract for the fields it
      intentionally retains: lexical identity, POS, senses, topics, forms, IPA sounds,
      etymology, examples, synonyms, antonyms, redirects, `alt_of`, and `form_of`. Translations,
      descendants, broader linkage taxonomies, audio URLs, IDs, raw glosses, categories,
      templates, and unknown fields are not persisted. Extraction diagnostics and the
      local inspection tool report retained and dropped fields without weakening defensive
      runtime checks."
    links: []
