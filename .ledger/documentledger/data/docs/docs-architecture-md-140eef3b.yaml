  - section_id: md:section:docs/architecture.md::lexical-lookup-and-segmentation
    doc_path: docs/architecture.md
    heading_path:
      - Runtime View
      - Lexical lookup and segmentation
    heading_slug: lexical-lookup-and-segmentation
    line_span:
      - 142
      - 149
    section_hash: a762ea2edf272558e73dc014499d66057b2fc02330adadc542e6361bcd4f5936
    summary: Lexical lookup and segmentation
    text: "## Lexical lookup and segmentation


      1. The consumer constructs `Lexicon` from one local SQLite artifact, resolved
      from the vendored, configured cache, or schema-aware managed dataset path when
      no override is supplied.

      2. Construction validates exact schema version, base language, coverage, and explicit
      capabilities before queries.

      3. An optional locale such as `GB` or `US` is runtime presentation state. It does
      not change artifact resolution or physical English dataset identity.

      4. `word()` and `contains()` query dictionary-derived lexemes. `word()` exposes
      casing attestation already stored in the lexeme row. `complete()` performs bounded
      normalized prefix completion through exact lookup and indexed lexical range queries.
      `segment()` evaluates known spans using authoritative full coverage, case flags,
      dynamic programming, and optional corpus rank, while retaining strict surface-case
      acceptance.

      5. Runtime reads do not acquire missing data or write to the artifact."
    links: []
  - section_id: md:section:docs/architecture.md::semantic-evidence
    doc_path: docs/architecture.md
    heading_path:
      - Runtime View
      - Semantic evidence
    heading_slug: semantic-evidence
    line_span:
      - 150
      - 160
    section_hash: 8343183ccbeafc219e77f36f8d6279522f0683c8c53910c0835fa8a91d14f857
    summary: Semantic evidence
    text: "## Semantic evidence


      1. `lexhint.semantics` maps supported raw source topics to stable `SemanticDomain`
      values at build time.

      2. Context distances are measured from the target character span. Every lexical
      token overlapping a non-empty target is excluded. If no lexical token overlaps,
      the target is a virtual insertion boundary and no real token is discarded.

      3. Nearby words are queried in batches. Domain weights receive configurable distance
      decay, with adjacent eligible tokens at distance 1.

      4. Results preserve cue text, character spans, token distance, and contribution
      weight. The candidate cannot validate itself. Domain results are hints rather
      than sense-disambiguated semantic certainty, and missing evidence is not negative
      evidence.




      <!-- archledger: no accepted records for this section yet -->"
    links: []
  - section_id: md:section:docs/architecture.md::deployment-view
    doc_path: docs/architecture.md
    heading_path:
      - Deployment View
    heading_slug: deployment-view
    line_span:
      - 161
      - 176
    section_hash: a8fcebb99b3edbc7f95088530e92cac94234f7b77f4afe941d37d9a7eb49244f
    summary: Deployment View
    text: "# Deployment View


      Lexhint is deployed as a local Python package and a local SQLite evidence artifact.
      There is no application server, worker, or persistent service.


      - Consumers install the package and open an artifact with `Lexicon.from_path()`
      or the default `Lexicon` resolution.

      - Artifact paths are selected by the caller or build workflow; CLI `--path` is
      an explicit override.

      - `dictionary status` reports current row counts and metadata without rebuilding
      the artifact.

      - A complete local artifact supports offline lexical, segmentation, dictionary,
      and semantic reads when the corresponding capabilities are present.

      - Generated artifacts contain source and hash provenance for dictionary and corpus
      inputs.

      - Build downloads and replacements use temporary files and atomic rename.

      - Generated external datasets are distributed separately from code according to
      `DATA_SOURCES.md`.




      <!-- archledger: no accepted records for this section yet -->"
    links: []
