    section_hash: 32be2b8705e4dd864a1d3450fd51142bcb6c33db97248e1f4e31d16006720ba6
    summary: Lazy dictionary context
    text: "## Lazy dictionary context


      1. `Dictionary` opens or initializes a schema-v4 partial SQLite cache, or opens
      a full index, and validates language and coverage metadata. `from_path()` can
      infer the language from that metadata.

      2. Context tokenization finds nearby word tokens and identifies the target token
      by overlap or nearest span.

      3. The target token is excluded. Missing nearby words are fetched individually
      only when `fetch_missing` is enabled and offline mode is not active; `refresh`
      explicitly revisits cached words.

      4. Stored explicit topics are aggregated with distance decay into structured cues.
      `topic_scores` supports bounded windows and result limits, while `supports` returns
      `TopicEvidence` only when the requested topic reaches the threshold. Missing evidence
      is not negative evidence."
