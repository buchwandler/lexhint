    section_hash: 4458277dfe6e63c9e7706f976bd760616cd6c1914036db5d6f45fc52b3d06680
    summary: Building Block View
    text: "# Building Block View


      The package is a set of focused Python modules with the CLI as the outer adapter.


      - `lexhint.cli` parses commands, resolves languages and flags, formats human output,
      and emits stable JSON.

      - `lexhint.lexicon.Lexicon` resolves an explicit, vendored, or cached gzip word
      list, loads it lazily, provides membership and rank, and segments compact text.
      Inline words are supported for isolated consumers and tests.

      - `lexhint.dictionary.Dictionary` validates schema and language metadata, reads
      senses, and computes soft `TopicEvidence` with structured `ContextCue` values.
      `from_path()` can infer the language from a self-describing index.

      - `lexhint.store` defines schema-v4 SQLite storage, normalization, semantic row
      extraction, lookup state, and partial-cache updates.

      - `lexhint.kaikki` builds exact-word Kaikki URLs and streams JSONL responses for
      lazy fetches.

      - `lexhint.builder` streams local or remote bulk JSONL and writes a complete SQLite
      index.

      - `lexhint.download` defines supported languages, upstream URLs, cache paths,
      and atomic word-list downloads.

      - `lexhint.models` contains the immutable runtime evidence and advanced operation-result
      dataclasses.


      The public package exports only the principal runtime `Lexicon`, `Dictionary`,
      evidence models, exceptions, and version from `lexhint.__init__`. Build/download
      helpers remain importable from their owning advanced modules. Tests exercise module
      boundaries with local fixtures and mocked network calls.


      <!-- archledger: no accepted records for this section yet -->"
