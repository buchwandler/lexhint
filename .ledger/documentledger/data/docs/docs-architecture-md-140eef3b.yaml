    summary: Business context
    text: "## Business context


      ```text

      Lexical and semantic evidence ──> lexhint ──> consumer interpretation and speech
      policy

      Corpus frequency enrichment ────> lexhint ──> lexical ranking and evidence

      ```


      The consumer decides what an unknown run, version, or candidate should mean. Lexhint
      ends at evidence and does not own tokenization, pronunciation, or interpretation
      precedence."
