    summary: Bulk dictionary build
    text: "## Bulk dictionary build


      The builder reads a local path or HTTP(S) source through a text stream, filters
      entries by `lang_code`, retains senses with glosses or topics, commits incrementally,
      records source identity/hash and build statistics, labels local full indexes with
      a SHA-256 snapshot and remote full indexes as live, runs `ANALYZE`, and atomically
      replaces the target database.


