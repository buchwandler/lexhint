    section_hash: 7594d98a573c9f41443bbd542fa3ba52c835010f8c780b59ff0169b9be14c9e6
    summary: Building Block View
    text: "# Building Block View


      The package is organized around a local artifact runtime and focused build modules.


      - `lexhint.lexicon.Lexicon` owns read-only artifact access, lexical lookup, prefix
      completion, fuzzy suggestions, headword matching, indexed definition search, explicit
      headword relation lookup and resolution, segmentation, dictionary inspection,
      and semantic evidence queries.

      - `lexhint.schema` defines schema and capability validation for the self-describing
      SQLite artifact.

      - `lexhint.builder` creates fresh atomic artifacts from streamed source data and
      applies the immutable build plan.

      - `lexhint.extract` converts source records into curated lexical and dictionary
      data plus explicit relation candidates.

      - `lexhint.wiktextract_types` documents the narrow upstream JSONL contract consumed
      by Lexhint without depending on Wiktextract at runtime.

      - `lexhint.semantics` projects source topics into the stable `SemanticDomain`
      taxonomy.

      - `lexhint.frequency` and `lexhint.sources` resolve corpus enrichment and source
      provenance.

      - `lexhint.store` persists lexemes, domains, rich dictionary tables, headword
      relations, search indexes, metadata, and indexes.

      - `lexhint.cli` exposes build and runtime operations in human-readable and JSON
      forms.

      - `tools/inspect_wiktextract.py` and `tools/profile_wiktextract_relations.py`
      are developer-only local source analysis tools.


      The public package exports `Lexicon`, `HeadwordRelation`, `DictionarySearchHit`,
      and `SemanticDomain` as the principal consumer interface. It also exports `SCHEMA_VERSION`,
      `DATASET_VARIANTS`, `DATASET_VARIANT_NAMES`, `DEFAULT_DATASET_VARIANT`, and `supported_base_languages()`
      for the separate dataset publisher contract. Build and source helpers remain available
      from their owning modules."
