    heading_slug: capability-specific-schema
    line_span:
      - 179
      - 184
    section_hash: 66a32be1ab7c0195ddc98b94a1fa9984c1d0148acb21dc6459150c4367a3984e
    summary: Capability-specific schema
    text: "### Capability-specific schema


      Schema metadata is explicit and self-describing. `language`, `locale`, `variant`,
      `schema_version`, and `dataset_version` remain separate dimensions. Locale is
      optional and does not create `en-GB` or `en-US` artifacts. Strict equality, not
      a compatibility range, controls SQLite access.


      Schema 7 metadata is explicit and self-describing. `lexemes` is always present
      for lexical capability and already stores lowercase, titlecase, and uppercase
      attestation flags exposed by `WordEvidence`. `lexeme_domains` exists only for
      `semantic`; each row stores bounded deterministic weight and source-topic provenance.
      Rich `entries`, `senses`, `sense_topics`, forms, and pronunciations exist only
      for `dictionary`. Old partial-cache schemas are rejected and must be rebuilt.
      Prefix completion uses the existing `lexemes.word` primary-key range and does
      not require a schema change."
    links: []
