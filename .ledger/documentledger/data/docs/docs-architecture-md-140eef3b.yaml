  - section_id: md:section:docs/architecture.md::solution-strategy
    doc_path: docs/architecture.md
    heading_path:
      - Solution Strategy
    heading_slug: solution-strategy
    line_span:
      - 99
      - 112
    section_hash: 9f82b00a99c7fc9d417f87edbd4c41abfac67ef07ca66da77c3263065dbc453c
    summary: Solution Strategy
    text: "# Solution Strategy


      The solution is organized around a small, explicit evidence pipeline.


      1. Resolve canonical capabilities, profile, frequency mode, source paths, and
      offline or refresh policy in an immutable build plan before schema creation.

      2. Keep lexical membership and corpus frequency evidence independent from semantic
      dictionary evidence.

      3. Build rich dictionary tables only for the `dictionary` capability and materialize
      topic projections only for `semantic`.

      4. Use authoritative full coverage, case flags, and dynamic programming for compact-string
      segmentation.

      5. Exclude every token overlapping the target span from semantic context scoring.

      6. Query nearby context words in batches and apply bounded distance decay to explicit
      domain evidence.

      7. Validate pinned source hashes and use temporary files followed by atomic rename
      for downloaded and rebuilt artifacts.

      8. Keep the consumer boundary narrow. Speech pronunciation rules remain downstream.

      9. Emit build configuration and progress on stderr so successful JSON output remains
      a single stdout document."
    links: []
