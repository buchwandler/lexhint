    summary: Lazy dictionary context
    text: "## Lazy dictionary context


      1. `Dictionary` opens or initializes a schema-v4 partial SQLite cache and validates
      language and coverage metadata.

      2. Context tokenization finds nearby word tokens and identifies the target token
      by overlap or nearest span.

      3. The target token is excluded. Missing nearby words are fetched individually
      only when `fetch_missing` is enabled and offline mode is not active.

      4. Stored explicit topics are aggregated with distance decay. `supports` returns
      evidence only when the requested topic reaches the threshold."
