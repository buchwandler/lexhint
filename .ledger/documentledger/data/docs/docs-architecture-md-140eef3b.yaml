  - section_id: md:section:docs/architecture.md::explicit-immutable-managed-dataset-artifacts
    doc_path: docs/architecture.md
    heading_path:
      - Cross-cutting Concepts
      - Explicit immutable managed dataset artifacts
    heading_slug: explicit-immutable-managed-dataset-artifacts
    line_span:
      - 199
      - 202
    section_hash: 01498a6f9d821ccf3a15b54b530dc5bc67b319e08a5abd35df8c5d7a3068875e
    summary: Explicit immutable managed dataset artifacts
    text: "## Explicit immutable managed dataset artifacts


      Lexhint treats published datasets as explicit, immutable local artifacts rather
      than package-installed Python models. The dataset manager stores artifacts by
      normalized base language, capability variant, exact schema family, and exact release
      version under the persistent data directory. Downloads stream gzip data, verify
      manifest hashes, sizes, schema, language, coverage, and capabilities, then atomically
      install the database and sidecar metadata. Runtime Lexicon construction resolves
      only installed files and never contacts the network automatically. The highest-capability
      compatible installed variant is selected by default, while callers may pin a variant
      and release version."
    links: []
  - section_id: md:section:docs/architecture.md::architecture-decisions
    doc_path: docs/architecture.md
    heading_path:
      - Architecture Decisions
    heading_slug: architecture-decisions
    line_span:
      - 203
      - 220
    section_hash: fc21bdbe862a02eb2ebb8a1f23b88a8146c2d5326c84f8a89bab6ad3f2067699
    summary: Architecture Decisions
    text: "# Architecture Decisions


      The current architecture records these decisions.


      - **Use a self-describing SQLite artifact.** Schema, language, coverage, profile,
      capabilities, and provenance are validated at runtime.

      - **Separate lexical, semantic, and dictionary capabilities.** Consumers can select
      the evidence they need without allowing data from an older artifact to leak into
      a fresh build.

      - **Use indexed lexical ranges for completion.** `complete()` is a local read-only
      normalized prefix query with exact-match priority and explicit frequency or lexical
      ordering.

      - **Treat frequency as enrichment.** Corpus rank improves segmentation and commonness
      evidence but does not define lexical capability.

      - **Build fresh artifacts atomically.** Capability-specific tables are created
      from the resolved build plan and replacements cannot expose partial output.

      - **Use stable semantic domains.** Raw source topics are projected into a small
      deterministic taxonomy at build time.

      - **Expose case attestation without weakening segmentation.** `word()` exposes
      normalized membership and stored case forms, while `segment()` retains surface-case
      acceptance so consumers can apply context-specific policy.

      - **Anchor semantic context to character spans.** Overlapping target tokens are
      excluded; a target with no lexical token is a virtual boundary whose adjacent
      cues remain eligible at distance 1.

      - **Treat semantic context as soft evidence.** Lexhint reports explainable hints,
      not sense disambiguation or semantic certainty.

      - **Keep the runtime read-only and offline by default.** Acquisition belongs to
      explicit build workflows.

      - **Keep a narrow consumer boundary.** Lexhint supplies evidence; downstream consumers
      own interpretation and speech rendering.


      <!-- archledger: no accepted records for this section yet -->"
    links: []
