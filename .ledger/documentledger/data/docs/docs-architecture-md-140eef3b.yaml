    text: "## Bulk dictionary build


      The builder reads a local path or HTTP(S) source through a text stream, filters
      entries by `lang_code`, retains senses with glosses or topics, commits incrementally,
      records build statistics, runs `ANALYZE`, and atomically replaces the target database.




