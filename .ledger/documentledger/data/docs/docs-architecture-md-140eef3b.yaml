    section_hash: 504b258446748da0fd3736a54fbb2ef1c4a4c78ae59ad20ec313a94a8b69182d
    summary: Errors and offline behavior
    text: "### Errors and offline behavior


      Capability, coverage, schema, language, and missing-artifact failures have controlled
      public exceptions. Offline mode rejects every HTTP(S) build source and permits
      only local or already validated cached inputs. Frequency acquisition fails the
      build unless the caller explicitly selects `--no-frequency` or a custom source.
      Missing semantic evidence is not semantic negation."
    links: []
