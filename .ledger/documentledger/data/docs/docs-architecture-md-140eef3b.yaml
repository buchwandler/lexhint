    section_hash: d8459a6c44a45d0c5a49b197ae97120e8dc24e6fe80761d1008ef5f69a9d3a2a
    summary: Building Block View
    text: "# Building Block View


      The package is organized around a local artifact runtime and focused build modules.


      - `lexhint.lexicon.Lexicon` owns read-only artifact access, lexical lookup, prefix
      completion, segmentation, dictionary inspection, and semantic evidence queries.

      - `lexhint.schema` defines schema and capability validation for the self-describing
      SQLite artifact.

      - `lexhint.builder` creates fresh atomic artifacts from streamed source data and
      applies the immutable build plan.

      - `lexhint.extract` converts source records into curated lexical and dictionary
      data.

      - `lexhint.semantics` projects source topics into the stable `SemanticDomain`
      taxonomy.

      - `lexhint.frequency` and `lexhint.sources` resolve corpus enrichment and source
      provenance.

      - `lexhint.store` persists lexemes, domains, rich dictionary tables, metadata,
      and indexes.

      - `lexhint.cli` exposes build and runtime operations in human-readable and JSON
      forms.


      The public package exports `Lexicon` and `SemanticDomain` as the principal consumer
      interface. It also exports `SCHEMA_VERSION`, `DATASET_VARIANTS`, `DATASET_VARIANT_NAMES`,
      `DEFAULT_DATASET_VARIANT`, and `supported_base_languages()` for the separate dataset
      publisher contract. Build and source helpers remain available from their owning
      modules."
