  - section_id: md:section:docs/architecture.md::architecture-constraints
    doc_path: docs/architecture.md
    heading_path:
      - Architecture Constraints
    heading_slug: architecture-constraints
    line_span:
      - 40
      - 55
    section_hash: 0e8a5d900e90c1bb48298a54091d4a9527f6db96b719a8cc9b973104624c0af7
    summary: Architecture Constraints
    text: "# Architecture Constraints


      The architecture is constrained by a local, self-describing SQLite artifact and
      by the external sources used to build it.


      - `lexhint.Lexicon` opens artifacts through SQLite read-only mode.

      - Runtime operations never fetch network resources, create missing lexemes, or
      write partial caches.

      - The CLI resolves default cached or vendored artifacts for ordinary reads and
      exposes `dictionary status` for current SQL counts.

      - `SCHEMA_VERSION` is an exact artifact compatibility key. Current schema 7 clients
      select and open only schema 7 artifacts; schema families are stored side by side
      under `s<schema>` paths.

      - Metadata records schema version, base language, coverage, profile, capabilities,
      creation time, builder version, and source provenance.

      - `lexemes` is present for the lexical capability. Semantic and dictionary tables
      are capability-specific.

      - Default builds select `lexical,semantic,dictionary` and automatic pinned full
      FrequencyWords enrichment.

      - Frequency is enrichment, not a capability.

      - External dictionary and corpus data remain separate from the Apache-2.0 code
      and retain their licensing obligations.


      <!-- archledger: no accepted records for this section yet -->"
    links: []
