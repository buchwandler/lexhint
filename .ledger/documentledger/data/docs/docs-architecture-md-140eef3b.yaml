    section_hash: dd22598f09087dd851056b8a8e833f162749cf9b94eb58eaa1bea8b8e3cdc3f3
    summary: Capability-specific schema
    text: "### Capability-specific schema


      Schema metadata is explicit and self-describing. `language`, `locale`, `variant`,
      `schema_version`, and `dataset_version` remain separate dimensions. Locale is
      optional and does not create `en-GB` or `en-US` artifacts. Strict equality, not
      a compatibility range, controls SQLite access.


      Schema 10 metadata is explicit and self-describing. `lexemes` is always present
      for lexical capability and stores lowercase, titlecase, and uppercase attestation
      flags exposed by `WordEvidence`. `lexeme_domains` exists only for `semantic`;
      rich `entries`, `senses`, `sense_topics`, and `headword_relations` exist only
      for `dictionary`; `lexeme_ngrams` exists for `search`; and `sense_search_terms`
      exists for `dictionary` plus `search`. Search and relation metadata record index
      and row counts, and projections remove claims for excluded structures. Schema
      9 artifacts are rejected and must be rebuilt; schema 9 and schema 10 dataset families
      remain side by side on disk.


      Managed dataset variants select capability subsets in a strict chain: `lexical`,
      `runtime` (`lexical,semantic`), `dictionary` (`lexical,semantic,dictionary`),
      and `rich` (`lexical,semantic,dictionary,search`). A dictionary projection supports
      full entry/sense/topic inspection, explicit relation lookup, rendering, semantic
      context, and completion while intentionally omitting fuzzy suggestion and indexed
      definition/reverse search. Only rich includes both search structures."
    links: []
  - section_id: md:section:docs/architecture.md::source-contract-and-diagnostics
    doc_path: docs/architecture.md
