    summary: lexhint
    text: "# lexhint


      `lexhint` provides lexical and dictionary-derived semantic evidence for text-normalization
      and speech-front-end applications.


      It provides:


      - common-word membership and frequency ranks;

      - segmentation of compact identifiers and domain labels;

      - compact dictionary senses and semantic topics;

      - candidate-aware context evidence for downstream speech applications.


      `lexhint` does not verbalize text. Pronunciation and speech policy remain in the
      consuming application."
    links: []
