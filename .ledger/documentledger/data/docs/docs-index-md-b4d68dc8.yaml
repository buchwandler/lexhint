    summary: Dataset lifecycle
    text: "## Dataset lifecycle


      Install published SQLite datasets explicitly with `lexhint dataset download LANGUAGE`.
      The dataset manager stores language, capability variant, and release version side
      by side, verifies gzip and SQLite metadata before atomic installation, and never
      downloads from `Lexicon` or ordinary query commands. Use `dataset list`, `dataset
      info`, `dataset validate`, and `dataset remove` for local management; `dataset
      available` and `dataset download` are the networked catalog operations."
    links: []
