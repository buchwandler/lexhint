    summary: Lexhint
    text: "# Lexhint


      Lexhint is a local lexical-evidence engine backed by self-describing SQLite artifacts.


      It provides lexical membership, frequency enrichment, compact-string segmentation,
      stable semantic-domain evidence, and optional rich dictionary entries. It does
      not speak or normalize text.


      ```{toctree}

      :maxdepth: 2


      architecture

      changelog

      ```


      See the [README](https://github.com/buchwandler/lexhint) for installation, build
      commands, API examples, and data-source boundaries."
    links: []
