    section_hash: 8b0b76c1ecd2eaf4518c1bf9c96713d7f9efc48c72822c8240a308ccbe847e21
    summary: Quick start
    text: '## Quick start


      Install the package with its development dependencies:


      ```bash

      python -m pip install -e ".[dev]"

      ```


      Prepare the default English word list and try the CLI:


      ```bash

      lexhint setup

      lexhint word house

      lexhint segment chatgpt

      ```


      Use `--json` for machine-readable output and `--offline` to prevent dictionary
      network access.'
    links: []
