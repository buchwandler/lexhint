    section_hash: 5b2f9f8c02a8fa9724265069aaca6380c801f80f678e3189ce31c31aa23179f9
    summary: Added
    text: "### Added


      - Added CLI commands for lookup, segmentation, context evidence, artifact builds,
      dictionary inspection, and status

      - Added streamed Wiktextract and Kaikki dictionary builds that produce self-describing
      SQLite artifacts

      - Added stable semantic-domain evidence that explains context cues while excluding
      the target span

      - Added a local read-only Lexicon for dictionary-derived membership and compact
      identifier segmentation

      - Added zero runtime dependencies and support for Python 3.10 through 3.14"
    links: []
